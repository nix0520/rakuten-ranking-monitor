name: Analysis regression checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Unit and data integrity tests
        run: python3 -m unittest discover -s tests -v
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Desktop and mobile interaction tests
        run: node tests/browser_smoke.cjs
