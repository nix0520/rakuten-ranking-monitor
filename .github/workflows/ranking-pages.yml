name: Test and deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'assets/**'
      - 'index.html'
      - 'scripts/assemble_pages.py'
      - '.github/workflows/ranking-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rakuten-ranking-pages-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Assemble static site
        run: python3 scripts/assemble_pages.py --source . --output _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
